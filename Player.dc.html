<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" />
<script src="./image-slot.js"></script>
<style>
  body { margin: 0; }
  a { color: #D0BCFF; }
  a:hover { color: #EADDFF; }
</style>
</helmet>
<div style="position:absolute;inset:0;font-family:Roboto,system-ui,sans-serif;color:var(--on,#E6E0E9);overflow:hidden">

  <sc-if value="{{ isA }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--playerTint,#2A2233) 0%,var(--surf2,#211F26) 46%,var(--surf2,#211F26) 100%)">
      <div style="height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:0 4px">
        <button type="button" onClick="{{ onCollapse }}" style="width:48px;height:48px;flex:none;border:0;background:transparent;color:var(--onv,#CAC4D0);border-radius:24px;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(230,224,233,0.08)"><span style="font-family:'Material Symbols Rounded';font-size:24px;line-height:1">keyboard_arrow_down</span></button>
        <div style="flex:1;min-width:0;text-align:center">
          <div style="font-size:11px;letter-spacing:0.5px;text-transform:uppercase;color:var(--onv,#CAC4D0)">Playing from</div>
          <div style="font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ source }}</div>
        </div>
        <button type="button" style="width:48px;height:48px;flex:none;border:0;background:transparent;color:var(--onv,#CAC4D0);border-radius:24px;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(230,224,233,0.08)"><span style="font-family:'Material Symbols Rounded';font-size:24px;line-height:1">more_vert</span></button>
      </div>
      <div style="height:32px;flex:none"></div>
      <div style="height:330px;flex:none;position:relative">
        <sc-if value="{{ ownArt }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;left:33px;top:0;width:330px;height:330px"><image-slot id="{{ artId }}" shape="rounded" radius="16" placeholder="Drop cover art"></image-slot></div>
        </sc-if>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;padding:0 24px 8px">
        <div style="height:36px;flex:none"></div>
        <div style="display:flex;align-items:flex-start;gap:12px">
          <div style="flex:1;min-width:0">
            <div style="font-size:24px;font-weight:500;line-height:32px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ title }}</div>
            <div style="font-size:16px;line-height:24px;color:var(--onv,#CAC4D0);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ artist }}</div>
          </div>
          <button type="button" onClick="{{ onLike }}" style="width:48px;height:48px;flex:none;margin-top:-4px;border:0;background:transparent;color:var(--accent,#D0BCFF);border-radius:24px;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(208,188,255,0.10)"><span style="font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-variation-settings:'FILL' {{ likeFill }}">favorite</span></button>
        </div>
        <div style="height:20px;flex:none"></div>
        <div onClick="{{ onSeek }}" style="height:20px;flex:none;display:flex;align-items:center;cursor:pointer">
          <div style="position:relative;height:16px;flex:1;display:flex;align-items:center">
            <div style="position:absolute;left:0;right:0;height:4px;border-radius:2px;background:var(--outlinev,#49454F)"></div>
            <div style="position:absolute;left:0;height:4px;border-radius:2px;background:var(--accent,#D0BCFF);width:{{ pct }}"></div>
            <div style="position:absolute;width:16px;height:16px;border-radius:8px;background:var(--accent,#D0BCFF);left:{{ pct }};margin-left:-8px"></div>
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--onv,#CAC4D0);padding-top:4px">
          <span>{{ position }}</span>
          <span>{{ duration }}</span>
        </div>
        <div style="height:8px;flex:none"></div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <button type="button" onClick="{{ onShuffle }}" style="width:48px;height:48px;border:0;background:transparent;color:{{ shuffleColor }};border-radius:24px;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(230,224,233,0.08)"><span style="font-family:'Material Symbols Rounded';font-size:24px;line-height:1">shuffle</span></button>
          <button type="button" onClick="{{ onPrev }}" style="width:56px;height:56px;border:0;background:transparent;color:var(--on,#E6E0E9);border-radius:28px;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(230,224,233,0.08)"><span style="font-family:'Material Symbols Rounded';font-size:36px;line-height:1;font-variation-settings:'FILL' 1">skip_previous</span></button>
          <button type="button" onClick="{{ onPlay }}" style="width:72px;height:72px;border:0;border-radius:36px;background:var(--accent,#D0BCFF);color:var(--onAccent,#381E72);cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="filter:brightness(1.08)"><span style="font-family:'Material Symbols Rounded';font-size:40px;line-height:1;font-variation-settings:'FILL' 1">{{ playIcon }}</span></button>
          <button type="button" onClick="{{ onNext }}" style="width:56px;height:56px;border:0;background:transparent;color:var(--on,#E6E0E9);border-radius:28px;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(230,224,233,0.08)"><span style="font-family:'Material Symbols Rounded';font-size:36px;line-height:1;font-variation-settings:'FILL' 1">skip_next</span></button>
          <button type="button" onClick="{{ onRepeat }}" style="width:48px;height:48px;border:0;background:transparent;color:{{ repeatColor }};border-radius:24px;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(230,224,233,0.08)"><span style="font-family:'Material Symbols Rounded';font-size:24px;line-height:1">{{ repeatIcon }}</span></button>
        </div>
        <div style="flex:1"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px 4px">
          <button type="button" onClick="{{ onLyrics }}" style="height:40px;padding:0 16px;border:0;border-radius:20px;background:transparent;color:var(--onv,#CAC4D0);font-family:Roboto,sans-serif;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px" style-hover="background:rgba(230,224,233,0.08)"><span style="font-family:'Material Symbols Rounded';font-size:20px;line-height:1">lyrics</span>Lyrics</button>
          <button type="button" style="width:48px;height:48px;border:0;background:transparent;color:var(--onv,#CAC4D0);border-radius:24px;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(230,224,233,0.08)"><span style="font-family:'Material Symbols Rounded';font-size:22px;line-height:1">graphic_eq</span></button>
          <button type="button" style="width:48px;height:48px;border:0;background:transparent;color:var(--onv,#CAC4D0);border-radius:24px;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(230,224,233,0.08)"><span style="font-family:'Material Symbols Rounded';font-size:22px;line-height:1">bedtime</span></button>
          <button type="button" onClick="{{ onQueue }}" style="height:40px;padding:0 16px;border:0;border-radius:20px;background:transparent;color:var(--onv,#CAC4D0);font-family:Roboto,sans-serif;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px" style-hover="background:rgba(230,224,233,0.08)"><span style="font-family:'Material Symbols Rounded';font-size:20px;line-height:1">queue_music</span>Queue</button>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ isB }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;background:var(--surf2,#211F26)">
      <div style="height:430px;flex:none;position:relative">
        <sc-if value="{{ ownArt }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;inset:0"><image-slot id="{{ artId }}" shape="rect" placeholder="Drop cover art"></image-slot></div>
        </sc-if>
        <div style="position:absolute;left:0;right:0;bottom:0;height:160px;background:linear-gradient(180deg,rgba(20,18,24,0) 0%,var(--surf2,#211F26) 96%);pointer-events:none"></div>
        <div style="position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;gap:4px;padding:0 4px">
          <button type="button" onClick="{{ onCollapse }}" style="width:48px;height:48px;flex:none;border:0;border-radius:24px;background:rgba(20,18,24,0.42);color:#EDE7F0;cursor:pointer;display:flex;align-items:center;justify-content:center"><span style="font-family:'Material Symbols Rounded';font-size:24px;line-height:1">keyboard_arrow_down</span></button>
          <div style="flex:1"></div>
          <button type="button" style="width:48px;height:48px;flex:none;border:0;border-radius:24px;background:rgba(20,18,24,0.42);color:#EDE7F0;cursor:pointer;display:flex;align-items:center;justify-content:center"><span style="font-family:'Material Symbols Rounded';font-size:24px;line-height:1">more_vert</span></button>
        </div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;padding:0 24px 12px">
        <div style="font-size:11px;letter-spacing:0.5px;text-transform:uppercase;color:var(--onv,#CAC4D0)">{{ source }}</div>
        <div style="height:8px;flex:none"></div>
        <div style="display:flex;align-items:flex-start;gap:12px">
          <div style="flex:1;min-width:0">
            <div style="font-size:28px;font-weight:500;line-height:36px;letter-spacing:-0.2px;text-wrap:pretty">{{ title }}</div>
            <div style="font-size:16px;line-height:24px;color:var(--onv,#CAC4D0);padding-top:2px">{{ artist }}</div>
          </div>
          <button type="button" onClick="{{ onLike }}" style="width:48px;height:48px;flex:none;border:0;background:transparent;color:var(--accent,#D0BCFF);border-radius:24px;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(208,188,255,0.10)"><span style="font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-variation-settings:'FILL' {{ likeFill }}">favorite</span></button>
        </div>
        <div style="height:24px;flex:none"></div>
        <div onClick="{{ onSeek }}" style="height:20px;flex:none;display:flex;align-items:center;cursor:pointer">
          <div style="position:relative;height:16px;flex:1;display:flex;align-items:center">
            <div style="position:absolute;left:0;right:0;height:4px;border-radius:2px;background:var(--outlinev,#49454F)"></div>
            <div style="position:absolute;left:0;height:4px;border-radius:2px;background:var(--accent,#D0BCFF);width:{{ pct }}"></div>
            <div style="position:absolute;width:16px;height:16px;border-radius:8px;background:var(--accent,#D0BCFF);left:{{ pct }};margin-left:-8px"></div>
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--onv,#CAC4D0);padding-top:4px">
          <span>{{ position }}</span>
          <span>{{ duration }}</span>
        </div>
        <div style="flex:1"></div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <button type="button" onClick="{{ onShuffle }}" style="width:48px;height:48px;border:0;background:transparent;color:{{ shuffleColor }};border-radius:24px;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(230,224,233,0.08)"><span style="font-family:'Material Symbols Rounded';font-size:24px;line-height:1">shuffle</span></button>
          <button type="button" onClick="{{ onPrev }}" style="width:56px;height:56px;border:0;background:transparent;color:var(--on,#E6E0E9);border-radius:28px;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(230,224,233,0.08)"><span style="font-family:'Material Symbols Rounded';font-size:36px;line-height:1;font-variation-settings:'FILL' 1">skip_previous</span></button>
          <button type="button" onClick="{{ onPlay }}" style="width:64px;height:64px;border:0;border-radius:20px;background:var(--accent,#D0BCFF);color:var(--onAccent,#381E72);cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="filter:brightness(1.08)"><span style="font-family:'Material Symbols Rounded';font-size:36px;line-height:1;font-variation-settings:'FILL' 1">{{ playIcon }}</span></button>
          <button type="button" onClick="{{ onNext }}" style="width:56px;height:56px;border:0;background:transparent;color:var(--on,#E6E0E9);border-radius:28px;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(230,224,233,0.08)"><span style="font-family:'Material Symbols Rounded';font-size:36px;line-height:1;font-variation-settings:'FILL' 1">skip_next</span></button>
          <button type="button" onClick="{{ onRepeat }}" style="width:48px;height:48px;border:0;background:transparent;color:{{ repeatColor }};border-radius:24px;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(230,224,233,0.08)"><span style="font-family:'Material Symbols Rounded';font-size:24px;line-height:1">{{ repeatIcon }}</span></button>
        </div>
        <div style="height:16px;flex:none"></div>
        <div style="display:flex;gap:8px">
          <button type="button" onClick="{{ onLyrics }}" style="flex:1;height:40px;border:0;border-radius:20px;background:var(--secContainer,#4A4458);color:var(--on,#E6E0E9);font-family:Roboto,sans-serif;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px" style-hover="filter:brightness(1.12)"><span style="font-family:'Material Symbols Rounded';font-size:20px;line-height:1">lyrics</span>Lyrics</button>
          <button type="button" onClick="{{ onQueue }}" style="flex:1;height:40px;border:0;border-radius:20px;background:var(--secContainer,#4A4458);color:var(--on,#E6E0E9);font-family:Roboto,sans-serif;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px" style-hover="filter:brightness(1.12)"><span style="font-family:'Material Symbols Rounded';font-size:20px;line-height:1">queue_music</span>Queue</button>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ isC }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;background:var(--surf2,#211F26)">
      <div style="height:48px;flex:none;display:flex;align-items:center;gap:4px;padding:0 4px">
        <button type="button" onClick="{{ onCollapse }}" style="width:48px;height:48px;flex:none;border:0;background:transparent;color:var(--onv,#CAC4D0);border-radius:24px;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(230,224,233,0.08)"><span style="font-family:'Material Symbols Rounded';font-size:24px;line-height:1">keyboard_arrow_down</span></button>
        <div style="flex:1;min-width:0;font-size:14px;font-weight:500;color:var(--onv,#CAC4D0);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ source }}</div>
        <button type="button" style="width:48px;height:48px;flex:none;border:0;background:transparent;color:var(--onv,#CAC4D0);border-radius:24px;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(230,224,233,0.08)"><span style="font-family:'Material Symbols Rounded';font-size:24px;line-height:1">more_vert</span></button>
      </div>
      <div style="height:8px;flex:none"></div>
      <div style="height:200px;flex:none;position:relative">
        <sc-if value="{{ ownArt }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;left:98px;top:0;width:200px;height:200px"><image-slot id="{{ artId }}" shape="rounded" radius="12" placeholder="Drop cover art"></image-slot></div>
        </sc-if>
      </div>
      <div style="flex:none;padding:20px 24px 0;display:flex;align-items:center;gap:12px">
        <div style="flex:1;min-width:0;text-align:center">
          <div style="font-size:20px;font-weight:500;line-height:26px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ title }}</div>
          <div style="font-size:14px;line-height:20px;color:var(--onv,#CAC4D0);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ artist }}</div>
        </div>
      </div>
      <div style="flex:none;padding:12px 24px 0">
        <div onClick="{{ onSeek }}" style="height:16px;display:flex;align-items:center;cursor:pointer">
          <div style="position:relative;height:12px;flex:1;display:flex;align-items:center">
            <div style="position:absolute;left:0;right:0;height:4px;border-radius:2px;background:var(--outlinev,#49454F)"></div>
            <div style="position:absolute;left:0;height:4px;border-radius:2px;background:var(--accent,#D0BCFF);width:{{ pct }}"></div>
            <div style="position:absolute;width:12px;height:12px;border-radius:6px;background:var(--accent,#D0BCFF);left:{{ pct }};margin-left:-6px"></div>
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--onv,#CAC4D0);padding-top:2px">
          <span>{{ position }}</span>
          <span>{{ duration }}</span>
        </div>
      </div>
      <div style="flex:none;padding:4px 16px 0;display:flex;align-items:center;justify-content:space-between">
        <button type="button" onClick="{{ onLike }}" style="width:44px;height:44px;border:0;background:transparent;color:var(--accent,#D0BCFF);border-radius:22px;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(208,188,255,0.10)"><span style="font-family:'Material Symbols Rounded';font-size:22px;line-height:1;font-variation-settings:'FILL' {{ likeFill }}">favorite</span></button>
        <button type="button" onClick="{{ onPrev }}" style="width:48px;height:48px;border:0;background:transparent;color:var(--on,#E6E0E9);border-radius:24px;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(230,224,233,0.08)"><span style="font-family:'Material Symbols Rounded';font-size:32px;line-height:1;font-variation-settings:'FILL' 1">skip_previous</span></button>
        <button type="button" onClick="{{ onPlay }}" style="width:60px;height:60px;border:0;border-radius:30px;background:var(--accent,#D0BCFF);color:var(--onAccent,#381E72);cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="filter:brightness(1.08)"><span style="font-family:'Material Symbols Rounded';font-size:34px;line-height:1;font-variation-settings:'FILL' 1">{{ playIcon }}</span></button>
        <button type="button" onClick="{{ onNext }}" style="width:48px;height:48px;border:0;background:transparent;color:var(--on,#E6E0E9);border-radius:24px;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(230,224,233,0.08)"><span style="font-family:'Material Symbols Rounded';font-size:32px;line-height:1;font-variation-settings:'FILL' 1">skip_next</span></button>
        <button type="button" onClick="{{ onLyrics }}" style="width:44px;height:44px;border:0;background:transparent;color:var(--onv,#CAC4D0);border-radius:22px;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(230,224,233,0.08)"><span style="font-family:'Material Symbols Rounded';font-size:22px;line-height:1">lyrics</span></button>
      </div>
      <div style="flex:1;min-height:0;margin:16px 12px 12px;background:var(--surf3,#2B2930);border-radius:16px;display:flex;flex-direction:column;overflow:hidden">
        <div style="flex:none;height:44px;display:flex;align-items:center;padding:0 8px 0 16px">
          <div style="flex:1;font-size:14px;font-weight:500;letter-spacing:0.1px">Up next</div>
          <button type="button" onClick="{{ onShuffle }}" style="width:36px;height:36px;border:0;background:transparent;color:{{ shuffleColor }};border-radius:18px;cursor:pointer;display:flex;align-items:center;justify-content:center"><span style="font-family:'Material Symbols Rounded';font-size:20px;line-height:1">shuffle</span></button>
          <button type="button" onClick="{{ onRepeat }}" style="width:36px;height:36px;border:0;background:transparent;color:{{ repeatColor }};border-radius:18px;cursor:pointer;display:flex;align-items:center;justify-content:center"><span style="font-family:'Material Symbols Rounded';font-size:20px;line-height:1">{{ repeatIcon }}</span></button>
          <button type="button" onClick="{{ onQueue }}" style="width:36px;height:36px;border:0;background:transparent;color:var(--onv,#CAC4D0);border-radius:18px;cursor:pointer;display:flex;align-items:center;justify-content:center"><span style="font-family:'Material Symbols Rounded';font-size:20px;line-height:1">queue_music</span></button>
        </div>
        <div style="flex:1;min-height:0;overflow:auto">
          <sc-for list="{{ upNext }}" as="row" hint-placeholder-count="4">
            <div style="height:56px;display:flex;align-items:center;gap:12px;padding:0 16px">
              <div style="width:40px;height:40px;flex:none;border-radius:6px;background:var(--surf4,#36343B);display:flex;align-items:center;justify-content:center;color:var(--outline,#938F99)"><span style="font-family:'Material Symbols Rounded';font-size:20px;line-height:1">music_note</span></div>
              <div style="flex:1;min-width:0">
                <div style="font-size:14px;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ row.title }}</div>
                <div style="font-size:12px;line-height:16px;color:var(--onv,#CAC4D0);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ row.artist }}</div>
              </div>
              <span style="font-family:'Material Symbols Rounded';font-size:20px;line-height:1;color:var(--outline,#938F99);flex:none">drag_handle</span>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>
</div>
