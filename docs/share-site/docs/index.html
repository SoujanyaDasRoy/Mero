<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mero</title>
<link rel="icon" href="logo.png">
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
         background: radial-gradient(circle at 50% 40%, #e9dafc, #c19cfc); color: #2a0a6b;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  img { width: 112px; height: 112px; border-radius: 28px; box-shadow: 0 12px 32px rgba(58, 10, 140, .25); }
  h1 { margin: 20px 0 4px; font-size: 32px; letter-spacing: .5px; }
  p { margin: 4px 0 20px; }
  a.button { display: inline-block; padding: 12px 24px; border-radius: 28px; background: #4b1fb0; color: #fff;
             text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <main>
    <img src="logo.png" alt="Mero">
    <h1>Mero</h1>
    <p>A free, ad-free music player for Android.</p>
    <a class="button" href="https://github.com/SoujanyaDasRoy/Mero/releases/latest">Get Mero</a>
  </main>
</body>
</html>
