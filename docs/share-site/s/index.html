<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A song on Mero</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #dcc9fa; color: #2a0a6b;
         font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; }
  a.button { display: inline-block; margin: 8px; padding: 12px 20px; border-radius: 24px; background: #4b1fb0;
             color: #fff; text-decoration: none; font-weight: 600; }
  a.plain { color: #4b1fb0; }
</style>
</head>
<body>
  <main>
    <p id="msg">Opening the song…</p>
    <p><a id="yt" class="button" href="#">Open in YouTube Music</a></p>
    <p><a class="plain" href="https://github.com/SoujanyaDasRoy/Mero/releases/latest">Get Mero, the free music player this link was shared from</a></p>
  </main>
<script>
  // Phones with Mero never load this page: Android hands the link straight to the app. This is for
  // everyone else, who is sent on to YouTube Music.
  var id = new URLSearchParams(location.search).get("v") || "";
  if (/^[A-Za-z0-9_-]{11}$/.test(id)) {
    var url = "https://music.youtube.com/watch?v=" + id;
    document.getElementById("yt").href = url;
    location.replace(url);
  } else {
    document.getElementById("msg").textContent = "This link is missing its song.";
    document.getElementById("yt").style.display = "none";
  }
</script>
</body>
</html>
